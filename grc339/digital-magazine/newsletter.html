<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <link rel="stylesheet" href="style.css">
      <link rel="stylesheet" href="https://use.typekit.net/qia2hfc.css">
      <title>The Archive</title>
      <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
      <meta http-equiv="Pragma" content="no-cache" />
      <meta http-equiv="Expires" content="0" />
   </head>
   <body>
      <div class="container">
         <header>
            <h1><a href="index.html"><img src="images/logo.svg" alt="The Archive Logo" /></a></h1>
            <nav>
               <ul>
                  <li><a href="#">Cameras</a></li>
                  <li><a href="#">Film</a></li>
                  <li><a href="#">Techniques</a></li>
                  <li><a href="#">Culture</a></li>
                  <li><a href="#">History</a></li>
                  <li><a href="#">Portfolios</a></li>
               </ul>
            </nav>
         </header>
         <main class="newsletter">
            <h2>Subscribe to The Archive</h2>
            <p>Sign up for our newsletter to receive stories on film photography, cameras, techniques, and visual culture.</p>
            <form>
               <label for="name">Name</label>
               <input type="text" name="name" id="name">
               <label for="email">Email</label>
               <input type="email" name="email" id="email">
               <h3>Select the newsletters you'd like to receive:</h3>
               <ul>
                  <li>
                     <input type="checkbox" id="cameras" name="cameras">
                     <label for="cameras">Camera Reviews & Equipment</label>
                  </li>
                  <li>
                     <input type="checkbox" id="film" name="film">
                     <label for="film">Film Stocks & Techniques</label>
                  </li>
                  <li>
                     <input type="checkbox" id="culture" name="culture">
                     <label for="culture">Photography Culture & History</label>
                  </li>
                  <li>
                     <input type="checkbox" id="portfolio" name="portfolio">
                     <label for="portfolio">Featured Portfolios</label>
                  </li>
               </ul>
               <button type="submit">Subscribe</button>
            </form>
         </main>
         <footer>
            <p class="footer">All rights reserved.</p>
         </footer>
      </div>
   </body>
</html>
